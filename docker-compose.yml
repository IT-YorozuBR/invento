services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invento-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Variáveis discretas (em vez de montar uma DATABASE_URL por
      # interpolação de texto) evitam quebra quando a senha tem
      # caracteres especiais como / + @ #.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-invento}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-invento}
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - npm_network
    # Sem "ports": a exposição pública é feita pelo Nginx Proxy Manager
    # via npm_network, apontando para invento-app:3000.
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    container_name: invento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-invento}
    volumes:
      - invento_db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invento} -d ${POSTGRES_DB:-invento}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invento_db_data:

networks:
  default: {}
  # Rede do Nginx Proxy Manager (definida em /opt/nginx-proxy-manager na VM).
  # external: true = não recriar, só se conectar à que já existe.
  npm_network:
    external: true
    name: nginx-proxy-manager_default
